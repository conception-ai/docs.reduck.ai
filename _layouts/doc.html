---
layout: docs-shell
---

<article class="docs-article">
	<header>
		<h1>{{ page.title }}</h1>
		<button class="btn medium btn-secondary" aria-label="Copy this page as markdown" data-copy="{{ page.url | relative_url | append: 'index.md' }}" type="button">
			{% include icon.html name="copy" %}
			Copy page
		</button>
	</header>

	{% include blocks.html blocks=page.blocks %}

	{%- if page.next_page -%}
		<nav class="docs-next" aria-label="Next page">
			<p class="label">Next</p>
			<a class="btn large btn-secondary" href="{{ page.next_page.url | relative_url }}">
				{% include icon.html name="arrow-right" %}
				{{ page.next_page.title }}
			</a>
		</nav>
	{%- endif -%}
</article>
